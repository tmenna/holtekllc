kind = "web"
previewPath = "/"
title = "Holtek Solutions LLC"
version = "1.0.0"
id = "artifacts/holtek-website"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 23348

[services.development]
run = "pnpm --filter @workspace/holtek-website run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/holtek-website", "run", "build" ]
publicDir = "artifacts/holtek-website/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23348"
BASE_PATH = "/"
